    semester: "Autumn Semester 2020"
    department: ""
    vvz: ""
    description: |
      1. Organisation und Entwicklung der Hämatopoiese einschließlich der Entwicklung hämatopoietischer Stammzellen; die Rolle von Wachstums- und Transkriptionsfaktoren in der Hämatopoiese; Physiologie und Pathologie des Hämoglobins; Erythrozytenphysiologie und Eisenstoffwechsel; die Prinzipien der Blutgruppen und Bluttransfusionen; die Prinzipien der Koagulation und die Pharmakologie der Koagulation; die Rolle von Thrombozyten und die pharmakologische Thrombozyteninhibition; Definition der Thrombophilie und Verständnis thrombotischer Ereignisse; Physiologie und Pathologie von Leukozyten; Laboranalyse von Blutproben.
      2. Struktur und anatomische Position der primären und sekundären lymphatischen Organe, Zellen und Moleküle des angeborenen Immunsystems, T- und B-Zell-Entwicklung und Rezeptor-Diversität, Haupthistokompatibilitätskomplex (MHC) und Antigenpräsentation, Effektor-B-Zellen und Antikörper, Effektor-T-Zellen, regulatorische T-Zellen und Zytokine, Allergie und Überempfindlichkeit, Autoimmunität und entzündungshemmende Medikamente, Transplantation und immunsuppressive Medikamente, Immunschwäche, Immunantwort bei Krebs und Immuntherapien.

  - identifier: "3fe339c6-0301-4139-8df9-97703e8dce2d"
    created: "2020-02-10"
    title: "Machine Perception"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Hilliges, Otmar"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-INFK/2020/Spring/263-3710-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-infk/2020/spring/263-3710-00L"
    semester: "Spring Semester 2020"
    department: ""
    vvz: "http://www.vorlesungsverzeichnis.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2020S&ansicht=LEHRVERANSTALTUNGEN&lerneinheitId=136831&lang=de"
    description: |
      We will focus on teaching: how to set up the problem of machine perception, the learning algorithms, network architectures and advanced deep learning concepts in particular probabilistic deep learning models 

      The course covers the following main areas:
       I) Foundations of deep-learning.
       II) Probabilistic deep-learning for generative modelling of data (latent variable models, generative adversarial networks and auto-regressive models). 
       III) Deep learning in computer vision, human-computer interaction and robotics.   

      Specific topics include: 
       I) Deep learning basics:
        a) Neural Networks and training (i.e., backpropagation)
        b) Feedforward Networks
        c) Timeseries modelling (RNN, GRU, LSTM)
        d) Convolutional Neural Networks for classification
       II) Probabilistic Deep Learning:
        a) Latent variable models (VAEs)
        b) Generative adversarial networks (GANs)
        c) Autoregressive models (PixelCNN, PixelRNN, TCNs)
       III) Deep Learning techniques for machine perception:
        a) Fully Convolutional architectures for dense per-pixel tasks (i.e., instance segmentation)
        b) Pose estimation and other tasks involving human activity
                      c) Deep reinforcement learning 
       IV) Case studies from research in computer vision, HCI, robotics and signal processing

  - identifier: "829f46c6-de09-459d-acd0-e2dc99a59b47"
    created: "2018-09-27"
    title: "Advanced Machine Learning"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Buhmann, Joachim Maximilian"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
