    description: |
      The construction details investigated in the lectures, thematized by guests and explored on site are always expressions of attitudes and craftsmanship allowing for a critical understanding of contemporary architectural practice. The series aims to define an array of details ranging from existing to transformed constructions, from history to the contemporary, from engineered high-tech joints to the as found cornerstone on one’s way to work. The construction detail as a beginning of an overarching question on our contemporary building culture complemented by varying voices, 1:1 experiences and contrasting architectural strategies. To provide a multiplicity of attitudes and positions the course will be supported by guest lecturers and experts and will take place at school. The yearlong lecture cycle is comprised of theoretical inputs, invited guests, site explorations, exercises as well as exchange in-between students. Each semester consists of multiple thematic cycles. 

      The content will be taught in English (with possible exceptions of guest lectures in German or French).

