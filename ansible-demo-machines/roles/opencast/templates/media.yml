  - identifier: "a3968633-94e1-437e-beac-4f72a056c521"
    created: "2026-02-12"
    title: "Dimension Dependence of Critical Phenomena in Percolation"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Hutchcroft, Thomas"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MATH/2026/Spring/401-5264-DRL"
    tobira_url: "https://www.video.ethz.ch/lectures/d-math/2026/spring/401-5264-drL"
    semester: "Spring Semester 2026"
    department: "D-MATH"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=205078&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      In Bernoulli bond percolation, we delete or retain each edge of a graph independently at random with some retention parameter p and study the geometry of the connected components (clusters) of the resulting subgraph. For lattices of dimension d>1, percolation has a phase transition, with a infinite cluster emerging at a critical probability pc(d). It is believed that critical percolation at and near the critical probability exhibits rich, fractal-like geometry that is expected to be approximately independent of the choice of lattice but highly dependent on the dimension d. In particular, various qualitative distinctions are expected between the low dimensional case d<6, the high-dimensional case d>6, and the critical case d=6, but this remains poorly understood particularly in dimensions d=3,4,5,6. In this course, I will give an overview of what is known about critical percolation, focusing on the non-planar models and including a detailed treatment of recent advances in long-range and hierarchical models for which various aspects of intermediate-dimensional critical phenomena can now be understood rigorously.

  - identifier: "f660f954-7a9a-4e72-83dc-9f5a7dc4e8b8"
    created: "2026-02-12"
    title: "Ergodic Theory of Surface Diffeomorphisms"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Crovisier, Sylvain Félix"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MATH/2026/Spring/401-5262-DRL"
    tobira_url: "https://www.video.ethz.ch/lectures/d-math/2026/spring/401-5262-drL"
    semester: "Spring Semester 2026"
    department: "D-MATH"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=202258&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      We propose to present recent advances in the study of the dynamics of non-uniformly hyperbolic diffeomorphisms, with a particular focus on the two-dimensional case.

      The dynamics of uniformly hyperbolic dynamical systems have been well understood since the 70’s (after Anosov, Smale, Sinai, Ruelle, Bowen,…): these systems are structurally stable under perturbations, they decompose into finitely many invariant basic pieces that can be studied separately, they exhibit well-described statistical behavior through classical limit theorems.
      Another classical tool for differentiable dynamics - Pesin theory - describes the geometric properties of any invariant probability measure which satisfies a non-uniformly hyperbolicity.

      These lectures will explore the non-uniformly hyperbolic set of a differentiable dynamical system: in dimension two, this set supports all the part of the dynamics which exhibits enough complexity - namely, which has positive entropy. We will discuss several techniques developed over the past fifteen years, including decomposition into Borel homoclinic classes, coding and reduction to a symbolic setting, high regularity rigidity from Yomdin theory. Although the decomposition may involve infinitely many pieces, we will explain how its complexity can be controlled by dynamical invariants such as entropy and Lyapunov exponents. Under suitable smoothness and expansion assumptions, we will see that most of the orbits equidistribute towards natural invariant measures (physical or maximizing the entropy), and satisfy statistical limit theorems.

