      Zellluläre Funktionen auf der Ebenen von Molekülen und Strukturen.
      Molekulare Vorgänge in der Prozessierung vom Gen zum Protein.
      Pflanzenphysiologie.

      Die folgenden Campbell Kapitel werden behandelt:

      Woche 1-5: 
      5	Biological macromolecules and lipids
      7	Cell structure and function
      8	Cell membranes
      10	Respiration: introduction to metabolism
      10	Cell respiration
      11	Photosynthetic processes

      Woche 6-9: 
      16	Nucleic acids and inheritance
      17	Expression of genes
      18	Control of gene expression
      19	DNA Technology

      Woche 9-13:
      35	Plant Structure and Growth
      36	Transport in vascular plants
      37	Plant nutrition
      38	Reproduction of flowering plants 
      39	Plants signal and behavior

  - identifier: "d5f7b63d-625c-4955-aa70-cd727285c905"
    created: "2026-04-24"
    title: "Halbleiterbauelemente"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Bolognesi, Colombo"
    contributor: "Popovic, Tamara"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-ITET/2026/Spring/227-0056-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-itet/2026/spring/227-0056-00L"
    semester: "Spring Semester 2026"
    department: "D-ITET"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=198367&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Brief survey of the history of microelectronics.
      Basic physics: Crystal structure of solids, properties of silicon and other semiconductors, principles of quantum mechanics, band model, conductivity, dispersion relation, equilibrium statistics, transport equations, generation-recombination (G-R), Quasi-Fermi levels.
      Physical and electrical properties of the pn-junction. pn-diode: Characteristics, small-signal behaviour, G-R currents, ideality factor, junction breakdown.
      MOS devices: Band diagram, MOSFET operation, CV- and IV characteristics, frequency limitations and non-ideal behaviour.
      Bipolar transistor: Operation principles, modes of operation, characteristics, models, simulation.

  - identifier: "7e8a1bfa-4bd6-42b7-a69f-615c15538bf9"
    created: "2026-04-23"
    title: "Electric Power Grid Systems"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Franck, Christian"
    contributor: "Hug, Gabriela"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-ITET/2026/Spring/247-0102-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-itet/2026/spring/247-0102-00L"
    semester: "Spring Semester 2026"
    department: "D-ITET"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199736&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      For decades, electric power grid systems remained essentially unchanged. Now, they are undergoing significant changes driven by technology. Despite or maybe even because of these changes it is important to understand the fundamental setup and workings of the electric power grid. 

      Participants will learn about the technical operation and management of traditional power grid systems. The fundamental equipment and mechanisms responsible for transforming and transporting electricity to end users and the concept of AC power will be explained. Typical grid connections and management and the underlying physical principles will be discussed. The opportunities for and barriers to future grid technology and systems from both an operator’s and end user’s perspective will be explored, potentially including distributed generation, microgrids/islanding, demand response, virtual power plants, etc.

