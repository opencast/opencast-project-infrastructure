  - identifier: "4aafad49-b98c-4099-8a6f-7837758695e7"
    created: "2026-01-30"
    title: "Wirtschaftssoziologie"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "deu"
    creator: "Hinz, Thomas"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-GESS/2026/Spring/851-0513-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-gess/2026/spring/851-0513-00L"
    semester: "Spring Semester 2026"
    department: "D-GESS"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199553&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      In der Vorlesung Wirtschaftssoziologie soll das Verhältnis von Soziologie und Ökonomie theoretisch wie empirisch fruchtbar bearbeitet werden. Wir beschäftigen uns unter soziologischem Blickwinkel mit der Produktion, der Verteilung, dem Austausch und dem Verbrauch knapper Güter und Dienstleistungen. Austauschprozesse unterliegen strukturellen Rahmenbedingungen und Grenzen, sie bedürfen in vielen Situationen normativer Regelungen und einer unterstützenden institutionellen Umgebung. Eine Definition der Wirtschaftssoziologie könnte so lauten: Wirtschaftssoziologie umfasst alle Beobachtungen, Begriffe, Hypothesen, Gesetzmäßigkeiten und Erklärungsmodelle, die sich auf Zusammenhänge von ökonomischen und sozialen Sachverhalten und Prozessen beziehen. Arbeitsgebiete der Wirtschaftssoziologie sind beispielsweise die soziale Bedingtheit wirtschaftlicher Vorgänge, die Rückwirkung ökonomischer Prozesse für gesellschaftliche Strukturen, die sozialen Dimensionen und Verhaltensprämissen, Ähnlichkeiten und Unterschiede zwischen Gesellschaften bezüglich des wirtschaftlichen Geschehens und Zusammenhänge zwischen sozialem und ökonomischem Wandel.

      Die Vorlesung behandelt zunächst knapp die makrosoziologischen Klassiker. Die Gründerväter der Soziologie haben wirtschaftlichem Handeln eine überragende Bedeutung für die Konstitution der Gesellschaft beigemessen - ob Marx, Simmel, Weber oder Durkheim. An der Schnittstelle von Soziologie und Ökonomie sind die Mikrotheorien von herausragender Bedeutung. Die Wirtschaftssoziologie ist ein ideales Terrain für Rational Choice Soziologie. Abweichungen vom Modell des Wettbewerbsmarktes und strikter Rationalität begründen in dieser Theorierichtung besonders interessante Analysen. Die Struktursoziologie (im Extremfall: "why people don't have any choices to make") wird durch die Konzeption sozialer Netzwerke, in denen Austauschprozesse stattfinden, berücksichtigt. Auch das interpretative Paradigma der Mikrosoziologie kann auf Fragestellungen der Wirtschaftssoziologie ("the making of markets") angewandt werden. 

      Die Wirtschaftssoziologie versteht sich als empirisches Projekt. In der modernen Wirtschaftssoziologie finden sich eine Vielzahl von Analysen ökonomischer Institutionen, von Markt und Organisation, von Konsumverhalten, Firmennetzwerken und Schwarzmärkten.

      Einen Überblick zu Theorien und Anwendungsgebieten der Wirtschaftssoziologie gibt das "Handbook of Economic Sociology" herausgegeben von Richard Swedberg und Neil Smelser (inzwischen in zweiter Auflage erschienen). Die Vorlesung beruht auf einzelnen Beiträgen des Handbuchs, ebenso werden einige eigene Studien des Dozenten vorgestellt.

