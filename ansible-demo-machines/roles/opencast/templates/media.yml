    title: "Physikalische Chemie I: Thermodynamik"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "CC-BY-NC-ND"
    language: "deu"
    creator: "Barnes, Alexander"
    contributor: ""
    publisher: "Multimedia Production, ETH Zürich"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-CHAB/2026/Spring/529-0012-01L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-chab/2026/spring/529-0012-01L"
    semester: "Spring Semester 2026"
    department: "D-CHAB"
    vvz: "https://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&ansicht=LEHRVERANSTALTUNGEN&lerneinheitId=198014&lang=de"
    description: |
      Zustandsgrössen und Prozessgrössen, das totale Differential als mathematische Beschreibung von Zustandsänderungen. Modelle: Das ideale und das reale Gas. Die drei Hauptsätze der Thermodynamik: Empirische Temperatur und thermodynamische Temperaturskala, innere Energie, Enthalpie, Entropie, thermisches Gleichgewicht. Mischphasenthermodynamik: Das chemische Potential. Ideale Lösungen und Mischungen, reale Lösungen und Mischungen, Aktivität, kolligative Eigenschaften. Tabellierung thermodynamischer Standardgrössen. Reaktionsthermodynamik: Reaktionsgrössen und Gleichgewichtsbedingungen, Gleichgewichtskonstante und deren Druck- und Temperaturabhängigkeit. Phasengleichgewichte und Phasendiagramme.

