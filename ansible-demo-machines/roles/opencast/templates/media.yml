    semester: "Spring Semester 2026"
    department: "D-BAUG"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199287&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Der Kurs verbindet praktische Übungen mit Vorlesungsblöcken auf eine Weise, dass Studierende aktiv während der Lehreinheiten mit Python Jupyter Notebooks mitarbeiten. Aufbauend auf den vermittelten Kompetenzen im Kurs «Programming of Civil Engineers» im Lesen, Vervollständigen und Entwickeln von Programmmustern in Matlab und Python, werden sich Studierende einen problemlösungsorientierten Werkzeugsatz mit den beliebtesten Python-Modulen in Python Jupyter Notebooks erarbeiten, um Python als Standardprogrammiersprache für weitere Studien zu konsolidieren. Alle Themen sind durch Problemstellungen aus unterschiedlichen Feldern der Bauingenieurpraxis motiviert. Sie bilden die Durchdringung des Bauingenieurwesens durch Computeranwendungen ab. Der Kurs ist in 8 Themenblöcke segmentiert (1VL=45min):
      1.	Arbeiten mit Python (4VL 4U): Auffrischen der Python Kenntnisse aus dem vorhergehenden Programmierkurs und Einführung in die Module NumPy, SciPy und MatPlotLib.
      2.	Large Language Modelle (4VL 4U): Produktiver Einsatz von LLM zum Lösen von Programmieraufgaben.
      3.	Python-I/O und Big Data (2VL 2U): Umgang mit umfangreichen Datensätzen mit Pandas. Sichten, verarbeiten, filtern und analysieren von Daten.
      4.	Graphische Visualisierung (2VL 2U): Generieren hochwertiger Abbildungen. 
      5.	Bildbearbeitung und –analyse (2VL 2U): Verwendung von Bildern und Sequenzen zur Lösung von Ingenieurproblemen.
      6.	Gleichgewichtslösungen (2VL 2U): Aufbau einfacher, zusammengesetzter Systeme und Ermittlung von deren Gleichgewichtslösung.
      7.	Dynamische Lösungen (4VL 4U): Ansätze zur Lösung der zeitlichen Entwicklung von Systemen und ihres dynamischen Verhaltens.
      8.	Optimierte Lösungen (4VL 4U): Strategien und Algorithmen zur Entwicklung und Optimierung von Systemen.

  - identifier: "2614e2c5-1c8f-4a6b-88a5-fba4c40da38a"
    created: "2026-02-04"
    title: "Quantum Mechanics II"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "CC-BY-NC-ND"
    language: "eng"
    creator: "Renner, Renato"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-PHYS/2026/Spring/402-0206-10L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-phys/2026/spring/402-0206-10L"
    semester: "Spring Semester 2026"
    department: "D-PHYS"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199725&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The description of indistinguishable particles leads us to (exchange-) symmetrized wave functions for fermions and bosons. We discuss simple few-body problems (Helium atoms, hydrogen molecule) und proceed with a systematic description of fermionic many body problems (Hartree-Fock approximation, screening, correlations with applications on atomes and the Fermi sea). The second quantisation formalism allows for the compact description of the Fermi gas, of elastic strings (phonons), and the radiation field (photons). We study the interaction of radiation and matter and the associated phenomena of radiative decay, light scattering, and the Lamb shift. Quantum statistical description of ideal Bose and Fermi gases at finite temperatures concludes the program. If time permits, we will touch upon of relativistic one particle physics, the Klein-Gordon equation for spin-0 bosons and the Dirac equation describing spin-1/2 fermions.

