  - identifier: "838a0a88-63fd-4f55-a71c-ea9e23c60751"
    created: "2026-02-13"
    title: "Bauprozess: Ökonomie"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "deu"
    creator: "Reichel, Hannes"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-ARCH/2026/Spring/063-0602-26L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-arch/2026/spring/063-0602-26L"
    semester: "Spring Semester 2026"
    department: "D-ARCH"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=200363&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Das Vertiefungsfach Bauprozess: Ökonomie ist an der Schnittstelle zwischen Ökonomie- hier betrachtet sowohl als „Wirtschaftswissenschaften“, als auch als ein Bereich der Sozialwissenschaften- und dem gebauten Raum angesiedelt.
      Den Studierenden wird mit zunehmender Vergrösserung des Massstabs vor Augen geführt, welche ökonomischen Zwänge und Möglichkeiten unsere Urbanität von der Stadtentstehung und –entwicklung bis hin zum einzelnen Gebäude beeinflussen. Um die Konsequenzen dieser ökonomischen und allgemein gesellschaftlichen Zustände anschaulich zu illustrieren wird auf jeder Massstabs-Stufe der Fokus zunächst aufgezogen und anhand einer extremen Manifestation, meist aus einer Metropole unserer Welt, oder anhand eines historischen Beispiels das Grundprinzip erläutert. Anschliessend wird auf den vertrauten Massstab der Stadt Zürich und seiner Agglomeration zurückgekehrt, um die gleichen Mechanismen hier zu untersuchen.
      In jedem Lehrmodul wird der Bezug zu und die Relevanz für das Metier der Architektinnen und Architekten thematisiert, die hier - dem Anspruch unserer Professur und der Stammvorlesung Bauprozess folgend - als Generalisten mit Spezialkenntnissen auch in ökonomischen Bereichen angesehen werden, ohne in diesen Bereichen ganz aufzugehen; ohne also aufzuhören, Architekten zu sein.

      Auswahl von Lerneinheiten:
      1.  Die Ökonomie der Stadt
      Ausgehend von der Frage, welche Gründe den Menschen bewogen, punktuell verdichtet und entfernt von seinen agrarischen Lebensgrundlagen zu siedeln, wird die Stadt als neuer Evolutionsstatus betrachtet, der sich baulich in den Silhouetten unserer Metropolen ausdrückt.
      Schrittweise wird versucht, die hinter dem sichtbaren Wirtschaftskegel agierenden Kräfte, wie Pendlerzeiten, Lohngefälle, Landkosten, Mietpreise, Verknappung und Renditen zu enttarnen. Am Beispiel der Metropolitanregion Zürich wird aufgezeigt, warum Stadtentwicklung und Bautätigkeit sich zu einem bestimmten Zeitpunkt in einer bestimmten Region auf eine bestimmte Art und Weise manifestiert haben.
      2.  Renditen
      Die verschiedenen Renditeformen als Mittler zwischen Investitionen und Erträgen werden anhand einer konkreten Projektentwicklung herausgearbeitet und ihr Einfluss auf das Projekt aufgezeigt, bzw. relativiert. Über den Begriff der Rendite wird die Relevanz der Zeitachse in der Planung und Erstellung eines Gebäudes veranschaulicht. Die ökonomische Betrachtung einer Liegenschaft und seine Aufteilung in Erstellungs- und Landkosten, sowie die Entstehung Letzterer aus den Renditeerwartungen heraus wird ebenso thematisiert, wie der Einfluss von Bewegungen auf den Zinsmärkten auf das Projekt, sowie auf die Rahmenbedingungen, unter denen wir Architektinnen und Architekten arbeiten.
      3.  Kosten
      Land-, Gebäude- und Erstellungskosten, als die vielleicht direkteste ökonomische Entsprechung von Architektur werden mit Hilfe der gängigen Methoden systematisiert und auf der Zeitachse des Planungs- und Bauprozesses eingeordnet. Kostenarten, -ermittlung, -planung und –kontrolle werden angesprochen, sowie die relevantesten Einflussfaktoren auf die Baukosten analysiert.
      4.  Projektentwicklung
      Diese Vorlesung ist der zunehmenden Komplexität, Professionalisierung und in der Folge Fremdbestimmung des Planungs- und Bauprozesses geschuldet. Die durch die Finanzkrise von 2008 und ihre Folgen noch gestiegene Attraktivität von Investitionen in Realgüter - und hier in vorderster Front die Immobilien - hat zu einer bereits lange davor stattfindenden Übernahme von Bewertungs- und Managementmethoden, sowie Organisationsformen aus der Finanzwirtschaft in die Immobilien- Projektentwicklung geführt. Die sich dadurch wandelnde Rolle des Architekten vom Generalisten zum Spezialisten in vielen Projektkonstellationen wird kritisch erläutert und hinterfragt.

  - identifier: "358286ed-c23e-454a-9a24-4c78aabdaebd"
    created: "2026-02-13"
    title: "Neural Systems"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Hahnloser, Richard"
    contributor: "Proix, Timothée"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-ITET/2026/Spring/227-0395-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-itet/2026/spring/227-0395-00L"
    semester: "Spring Semester 2026"
    department: "D-ITET"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=197530&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The course develops a multi-scale view of neural systems from membrane biophysics to cognition and decision making. It begins with ionic concentration gradients, Nernst potentials, and the membrane equivalent circuit, leading to conductance-based Hodgkin–Huxley dynamics and numerical simulation (Euler, Runge–Kutta). Reduced neuron models are derived and analyzed using dynamical-systems tools: phase portraits, fixed points, stability, basins of attraction, bistability, and bifurcations. Two-dimensional reductions introduce nullclines, limit cycles, and transitions to periodic spiking through saddle-node, SNIC, and Hopf bifurcations, explaining type I/type II excitability, integrator vs resonator behavior, resonance, rebound and inhibition-induced spiking, depolarization block, and the impact of noise near criticality. The course then bridges to population descriptions via density and mean-field ideas, neural mass models, and Wilson–Cowan excitatory–inhibitory circuits, including hysteresis and oscillations, and motivates large-scale brain simulations. Computational themes include synaptic potentials, firing-rate nonlinearities, integrate-and-fire and rate-based network models, and neural coding with tuning curves. Memory is covered through classic experimental findings (free recall scaling laws, forgetting, recognition capacity, clinical deficits) and computational accounts of associative retrieval and attractor-like network ideas (Hopfield-type networks). A major systems module uses birdsong as a model for speech learning: template formation, the role of auditory feedback and social context, performance-error measurement (including optimal-transport style matching), and the organization of the song system (HVC–RA motor pathway and AFP basal-ganglia loop with LMAN/Area X). Key experiments (population recordings aligned to song, lesions, cooling, stimulation, antidromic identification) motivate circuit functions such as timing sequences, variability injection, and reinforcement-driven plasticity, including dopaminergic performance-error/prediction-error signals from VTA to Area X and closed-loop optogenetic manipulations. Predictive models unify sensory and sensorimotor computation via forward models, corollary discharge, and prediction-error neurons, and extend to predictive coding as redundancy reduction in natural signals (spatial/temporal decorrelation; receptive fields in retina, LGN, and cortex; hierarchical predictive coding). Statistical foundations include Bayesian estimation and decision theory (priors/posteriors, MAP vs ML), causal inference in multisensory perception and vocal adaptation, estimation theory (bias–variance, Cramér–Rao), Fisher information and behavioral optimality, and Shannon entropy/conditional entropy and MDL with links to language modeling and information rates. Later modules connect these principles to modern learning and behavior: dimensionality reduction and representation learning, intrinsic motivation for exploration (softmax, bonuses, counters, E-values), curiosity via forward–inverse models and the noisy-TV problem, playfulness/manipulation drives revealed by sensory substitution, and empowerment as mutual-information-based control. The course concludes with neuroeconomics, relating utility and prospect theory to neural mechanisms and dopamine prediction-error responses.

