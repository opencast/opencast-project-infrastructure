  - identifier: "55855e67-a611-4a57-b860-930c05fbf3e5"
    created: "2026-01-23"
    title: "Quantenmechanik und Festkörperphysik II"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Spaldin, Nicola"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MATL/2026/Spring/327-0416-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-matl/2026/spring/327-0416-00L"
    semester: "Spring Semester 2026"
    department: "D-MATL"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199748&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      By the end of last semester we had developed the classical and quantum mechanical free-electron theories, and found that, particularly by including quantum mechanics, we could describe many of the properties of simple metals quite well. We found some peculiarities though, like positive Hall coefficients and negative masses, and didn't have the machinery to describe semiconductors or insulators.

      We'll start this semester by developing the band theory of solids, in order to address some of these deficiencies. We'll take two approaches: Starting from our Quantum Mechanical Free Electron Theory we will add a periodic potential, so that the electrons are not "free" any more. And starting from solving the Schrödinger equation for an atom, we will bring atoms together to form a crystal so that their atomic orbitals interact.

      We'll see that both approaches give us bands of allowed energy levels, with gaps between them, and allow us to capture many of the electronic properties of semiconductors and insulators.

      Finally, to understand thermal properties we will need to look at lattice vibrations, which will involve solving the Schrödinger equation for a harmonic oscillator.

