  - identifier: "cd3c6f7f-a407-4e92-baa3-1c0597e782d0"
    created: "2026-02-02"
    title: "Pflanzenbau"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "deu"
    creator: "Walter, Achim"
    contributor: "Buchmann, Nina; Hassold, Sonja; Richner, Walter; Streit, Bernhard; Haas, Ulrich Johannes; Huguenin-Elie, Olivier"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-USYS/2026/Spring/751-4107-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-usys/2026/spring/751-4107-00L"
    semester: "Spring Semester 2026"
    department: "D-USYS"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=197727&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Die Vorlesung ist in vier grosse inhaltliche Abschnitte untergliedert. Dies sind die Abschnitte Ackerbau, Futterbau, Herbologie und systematische Botanik. Diese Abschnitte werden durch unterschiedliche Dozierende unterrichtet. Während zweier obligatorischer Exkursionen sowie durch Literaturarbeit werden die Inhalte vertieft. Zudem werden Verbindungen zwischen den einzelnen Aspekten aufgezeigt.
      Der Teil ‘Ackerbau’ befasst sich mit grundlegenden Schritten des ackerbaulichen Feldmanagements wie Bodenbearbeitung, Aussaat und Pflanzenpflege. Einwirkungen auf die Bodenstruktur, unterschiedliche Bearbeitungsmassnahmen für unterschiedliche Kulturen sowie Unterschiede in der Intensität des Eingriffes im Vergleich einer konventionellen und einer bodenschonenden Bearbeitung (z.B. Direktsaat) werden erklärt. Ebenso werden die wichtigsten Unterschiede konventioneller, integrierter und biologischer Produktion angesprochen. Ein besonderer Schwerpunkt liegt auf der Etablierung von Fruchtfolgen unter Berücksichtigung der betrieblichen Gegebenheiten. Die Vorlesung bezieht sowohl wissenschaftliche Literatur als auch anwendungsnahe Publikationen ein; letztere werden mit den Studierenden im Hinblick auf acker- und futterbauliche Anwendung intensiver diskutiert. 
      Im Teil ‘Futterbau’ werden die verschiedenen Typen des Futterbaus und die wichtigsten Mischungen, aber auch natürliche Pflanzengemeinschaften in Mitteleuropa vorgestellt (Bestandesbeurteilung). Basierend auf der Ökophysiologie von Einzelpflanzen wird die Ökophysiologie von Pflanzenbeständen erarbeitet. Es werden verschiedene Arten der Bewirtschaftung vorgestellt (z. B. Bestandeslenkung durch Düngung, Beweidung, Schnitttermine, etc.) und ihre Auswirkungen auf die Bestandeszusammensetzung und auf die Erträge diskutiert. Feedback-Mechanismen zwischen Umwelt und Futterbausystemen werden angesprochen. Die Rolle von Biodiversität von Graslandsystemen wird thematisiert. 
      Der Teil ‘Herbologie’ vermittelt Grundkenntnisse über Biologie und Ökologie der Unkräuter, Unkraut-Kulturpflanzen-Interaktionen sowie Prinzipien chemischer, physikalischer und biologische Unkrautkontrolle. Weiter werden Mechanismen des gezielten Unkrautmanagements in unterschiedlichen Anbausystemen und Kulturen erläutert.
      Im Teil ‘’Systematische Botanik’ werden die bedeutendsten Pflanzenfamilien, welche für den Pflanzenbau wichtig sind, systematisch vorgestellt und anhand von Pflanzenmaterial anschaulich erklärt. Der systematische Ansatz steht im Zentrum dieser Vorlesung und dient als elementares Element zum selbständigen Bestimmen und Aneignen von Artenkenntnissen. Als Grundlage dazu werden auch die wichtigen morphologischen Begriffe zum Benennen von pflanzlichen Organen vorgestellt und angewendet. Darüber hinaus hilft ein Überblick zur Systematik der Pflanzen beim Einordnen der behandelten Pflanzenfamilien.

  - identifier: "cb085786-cf94-4c17-98ab-048ebaccf302"
    created: "2026-02-02"
    title: "Kulturpflanzen im World Food System"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "deu"
    creator: "Walter, Achim"
    contributor: "Huguenin-Elie, Olivier"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-USYS/2026/Spring/751-0280-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-usys/2026/spring/751-0280-00L"
    semester: "Spring Semester 2026"
    department: "D-USYS"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=198263&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Die Veranstaltung gliedert sich in zwei Abschnitte, die von  Dozierenden aus dem jeweiligen Fachgebiet unterrichtet werden. 

      Im ersten Abschnitt von acht oder neun Doppelstunden werden vor allem zentrale Kulturpflanzen der Schweiz und angrenzender Länder behandelt. Ein besonderer Schwerpunkt wird dabei auf Weizen gelegt. Für die wichtigsten ackerbaulichen Kulturpflanzen werden zentrale Aspekte der Produktion, aber auch der Nutzung und Qualitätskriterien der Produkte vorgestellt. Auch Weiterentwicklungsmöglichkeiten für Anbau und Entwicklung neuer Sorten sowie Forschungsfelder werden angesprochen. Ferner werden ausgewählte tropische Nutzpflanzen in für sie typischen Nutzungssystemen dargestellt. Bei allen Kulturpflanzen werden folgende Themen in unterschiedlicher Intensität behandelt: Ihre Bedeutung im Ernährungssystem, daraus gewonnene Produkte, Botanik, Oekophysiologie, Anbautechnik, Züchtung sowie ernährungsphysiologische Aspekte.

      Im zweiten Abschnitt werden die Bedeutung der Wiesen und Weiden als Landnutzungsform und das Leitbild des Schweizerischen Futterbaus vorgestellt. Morphologische Eigenschaften und Ansprüche der wichtigsten Gräser- und Leguminosenarten zur Raufutterproduktion im gemässigten Klima werden dargestellt. Darauf aufbauend wird beispielhaft die Bewirtschaftung intensiv und extensiv genutzter Wiesen behandelt und aufgezeigt wie sich diese unterschiedliche Bewirtschaftung auf die botanische Zusammensetzung und die Leistungen der Wiese auswirkt.

