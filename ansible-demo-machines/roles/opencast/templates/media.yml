  - identifier: "4b23bb9f-719c-4002-af07-a6b171f19006"
    created: "2026-02-16"
    title: "Climate, Ethics and Human Health"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Blasimme, Alessandro"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-HEST/2026/Spring/376-1663-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-hest/2026/spring/376-1663-00L"
    semester: "Spring Semester 2026"
    department: "D-HEST"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=198156&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The course offers students a survey of key topics surrounding the relationship between the changing climate and the health of human beings. This is achieved using principles and perspectives from the disciplines of bioethics and environmental ethics, with consideration to climate policy and societal implications.

      The course begins with an introduction to the fundamental scientific concepts of climate change, and related topics such as climate change denial. Next the course will provide an introduction to the discipline of environmental ethics, including topics such as the value of nature, Wilderness, and the Anthropocene, as a background of scholarship about how humans conceive of the environment and form beliefs that can be consequential for their actions.

      Once this foundation is established, students will move on to examine the interaction between climate change and human health. Students will be introduced to the impact of climate change on the physical and mental health of human beings, due to realities such as increasing temperatures, flooding, wildfire, and more unpredictable storms or drought. 

      The course proceeds to examine contributions from the discipline of bioethics to the area of climate change and human health, and the need for ethical reasoning in questions of the relationship between human beings and the rest of the natural world.  

      Throughout the content of the course, consideration will be given to the realities of structural injustice, and how we have built our society in ways that disadvantage certain groups of people, often those who are more vulnerable to begin with. Inherent in this discussion is an understanding of the social determinants of health, factors such as education, neighbourhood, income, and employment, which greatly influence health outcomes.  

      In the next section, the course presents current topics from the area of environmental biotechnology that are relevant for human health, such as geoengineering, vector borne disease, and antibiotic resistance. Also in this section, students will explore the topics of food security and unhealthy landscapes, or ‘riskscapes’, and related questions of health equity. 

      In conclusion, the course explores public policies and ethical duties emerging from the content thus far. Students will be presented with examples of public policy addressing the causes and effects of climate change, including policies designed for mitigation and adaptation, as well as citizen science initiatives. 

      Climate change is the reality that we all live in now. Through this course, we hope to help students investigate the connections between climate change and human health, and the values and ethical principles underlying how we understand this and respond, as individuals and as a society.

