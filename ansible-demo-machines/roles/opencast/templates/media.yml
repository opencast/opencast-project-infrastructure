  - identifier: "49ffc61f-5ec8-4fbb-9c78-af4cd3c6ee14"
    created: "2026-02-05"
    title: "Umweltproblemlösen II"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "deu"
    creator: "Mader, Marlene"
    contributor: "Pohl, Christian Erik; Hofmann, Benjamin"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-USYS/2026/Spring/701-0008-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-usys/2026/spring/701-0008-00L"
    semester: "Spring Semester 2026"
    department: "D-USYS"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199190&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Das erste Semester dient dazu das vorhandene Wissen zu einem aktuellen Fallthema im Nachhaltigkeitsbereich, seine Grundlagen und Herausforderungen zu sammeln. In Gruppen recherchieren sie einen bestimmten Teilaspekt, der sowohl eine Literatur- und Datenrecherche als auch eine Stakeholder-Analyse umfasst. Die Ergebnisse werden in einem wissenschaftlichen Bericht dokumentiert und im Rahmen einer internen Konferenz (als Vortrag, Rollenspiel oder Poster) präsentiert. Begleitend reflektieren die Studierenden ihre Gruppenzusammenarbeit in einem Lernjournal. Einführungen in die Literaturrecherche, wissenschaftliches Schreiben, Stakeholder-Analyse und Gruppenprozesse sowie regelmässige Zwischenberichte mit den Dozierenden unterstützen den Arbeitsprozess.

      Während der Semesterferien findet die Synthesewoche statt. In dieser Woche werden die Ergebnisse der verschiedenen Teilanalysen mittels Methoden des Design- und Systemdenkens integriert. Einzelne Probleme werden identifiziert und erste Lösungsvorschläge entwickelt.

      Im zweiten Semester entwickeln die Studierenden auf Basis der Teilanalysen aus UPL I konkrete Nachhaltigkeitsprojekte. In Gruppen wenden sie dabei selbstständig die erlernten Methoden wie Systemmodellierung und Design Thinking an, die sie in der Synthesewoche kennengelernt haben. Im engen Austausch mit Stakeholder:innen, identifizieren sie dabei Probleme, entwickeln ein Systemmodell und konkrete Lösungsideen, testen ihre Massnahmen und entwickeln diese anhand von Feedback und neuen Erkenntnissen ständig weiter. Am Ende präsentieren die Studierenden ihre Ergebnisse am öffentlichen «Markt der Massnahmen» den Dozierenden und interessierten Stakeholder:innen und dokumentieren diese in einem Factsheet und Bericht.

      Sie können ihre Massnahmen in einem freiwilligen dritten Semester umsetzen.


      Die Studierenden arbeiten die meiste Zeit selbständig in Gruppen. In zentralen Schritten werden sie von Tutorierenden unterstützt. Speziell eingeführt werden die Studierenden in:
      - Das Thema der Fallstudie (durch externe Fachexpert:innen)
      - Recherche, wissenschaftliches Schreiben und Literaturverwaltung (durch Expert:innen der ETH Bibliothek),
      - Rollenverhalten und Zusammenarbeit in der Gruppe,
      - Erstellen eines qualitativen Systemmodells (mit SystemQ),
      - Entwickeln von Lösungsideen (Design Thinking, Checklands' soft systems methodology).

