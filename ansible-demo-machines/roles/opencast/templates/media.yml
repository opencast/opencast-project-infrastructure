  - identifier: "1e59f5bb-fc29-4acc-8e3f-d6333a9a2d2d"
    created: "2026-02-10"
    title: "From Chemical to Biological Evolution on Earth and other Planets"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Riek, Roland"
    contributor: "Reiher, Markus; Wennemers, Helma; Sossi, Paolo Angelo; Vance, Derek; Hemingway, Jordon; Stoll, Heather; Magnabosco, Cara; Piel, Jörn; Pellissier, Loïc; Queloz, Didier; Dorn, Caroline; Quanz, Sascha Patrick; Silvestro, Daniele"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-CHAB/2026/Spring/529-0101-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-chab/2026/spring/529-0101-00L"
    semester: "Spring Semester 2026"
    department: "D-CHAB"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=201298&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The origin of life is an important unresolved scientific question of trans-disciplinary nature. It thus can only be addressed adequately, both at the teaching and research level, through engagement with a diverse field of sciences.  Tremendous progress is currently being seen in research, including processes that generate the molecular building blocks for life and drive the transition to emergent biological entities, that quantify the capability of planetary environments to meet, maintain and diversify conditions for complex life and how life shapes planetary environments, that characterize the diversity of planetary environments and their ability to host life, and to investigate non-standard life and life in extreme environments.
      The lecture is part of the activities of the Center for the Origin and Prevalence of Life (COPL). Each double lecture another lecturer will introduce another puzzle on the topic of interest and the students will elaborate on the topic following a journal club approach on the basis of mile stone papers. 
      Because of the broad research topic, the lecturers will be grouped to the four following topics to get coherency: Earth evolution, Chemical Evolution, Life evolution, Planet evolution.
      Each week or every two weeks the lectures will consist of a
      (i) Short literature seminar: a milestone paper or/and an accompanying review will be chosen and made known to the whole class. Pairs of students from different scientific backgrounds will be formed and assigned beforehand to present the milestone paper to the class and facilitate the ensuing discussion. Alternative, a lecture may be given first and the week after the paper presented.

      (ii) Research seminar: the presentation of the milestone paper will serve as the introduction to the lecture by one of the lecturers of the course on their own state-of-the-art research in the field.
      A special emphasis is put into the transdisciplinary nature of the topic offering special support to the students that lack some inter-disciplinary knowledge.

