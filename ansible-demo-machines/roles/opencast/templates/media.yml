    department: "D-MATH"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=198809&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      -Tempered Distribution Theory (Some Topological Properties of Frechet Spaces, Banach Steinhaus for Frechet Spaces, Schwartz space, Rapidely Decreasing Functions, Fourier Transform of Tempered Distributions, Convolutions of Distributions with convolutive supports, Schwartz  Lemma on Distribution supported at a point, Harmonic Tempered Distribution...)
      -Hilbert-Sobolev Spaces (Hilbert Sobolev Algebras, Hilbert Sobolev Embeddings, Trace Spaces...)
      -Some Cauchy Problems in Hilbert-Sobolev Spaces (Elliptic,Parabolic and Hyperbolic)
      -Revisions from FAI in the context of L^p Spaces (separability, reflexivity, dual, weak and strong topologies, Banach Alaoglu, Kakutani, Eberlein Smulian, uniform convexity)
      -The cases of L^1 and L^\infty   Radon measures.
      -The topology of quasi-Banach spaces and their metrisability (Aoki Rolewicz Theorem). The Marcinkiewicz weak L^p spaces. The non local convexity of L^1-weak.
      - The Hardy-Littlewood Maximal Function
      -Weak and strong (p,q) Operators
      -Marcinkiewicz Interpolation Theorem
      -Bessel and Riesz Potentials and application to Banach-Sobolev Embeddings
      -L^p Theory of Calderon Zygmund Operators
      -Multiplier Operators
      -The use of Fourier Transform for the caracterisation of classical Banach Function Spaces (Introduction to Littlewood Paley Theory).

