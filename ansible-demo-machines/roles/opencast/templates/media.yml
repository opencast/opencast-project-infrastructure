      Unter dem übergeordneten Thema „Anfänge“ vergleicht jede Vorlesung eine Gruppe von Bauwerken sowie zugehörige Texte und Bildquellen, um zu untersuchen, wie Gebäude, Ideen, Ereignisse, Performances, Transformationen usw. einen „Anfang“ im Raum oder in der Zeit markieren können. In einer festen Struktur wird das jeweilige Thema zunächst anhand eines kanonischen europäischen Bauwerks eingeführt, anschliessend durch den Vergleich mit einem aussereuropäischen Beispiel erweitert und schliesslich anhand eines Beispiels aus der Schweiz vertieft.
      Auf die Vorlesungen folgt jeweils eine Übungseinheit, in der die Studierenden einen Text (Quellentext, wissenschaftliche Publikation o. Ä.) lesen und dazu einen kurzen Essay verfassen. Ziel der Übung ist es, die Inhalte der Vorlesung zu ergänzen, vor allem aber Aufgaben zu bearbeiten, die gezielt auf die Essayfragen der Sessionsprüfung vorbereiten. Die Übungen sind daher ein integraler Bestandteil der Prüfungsvorbereitung.

