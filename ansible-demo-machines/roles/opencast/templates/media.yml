    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=197514&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      This course introduces the economics of sustainability from both a public/societal and private/business perspective. The course reviews both the conceptual foundations and presents essential tools for the private and public management of sustainability. Covered topics in conceptual foundations include how to define and measure sustainability in different domains (e.g., of the macroeconomy overall, of specific systems such as fisheries, of businesses, etc.), an introduction to dynamic economic and environmental systems and optimization, the characterization of core trade-offs in sustainability (across sustainability goals, different members of society, generations, etc.), the potential roles of the private vs. public sector in ensuring sustainability, and of the critical role of innovation and technological development in sustainability. Covered tools include methods for quantifying consumer demand for sustainability and stakeholder responses to sustainability (e.g., in capital and labor markets), methods for quantifying the economic value of environmental goods, principles of cost-benefit analysis, fundamentals of consumer theory, and an introduction to quantitative methods used to evaluate the costs and effectiveness of sustainability actions. The course will also delve into specific applications such as energy resources, climate change, biodiversity, and air pollution.

      Course evaluation: at the end of the course, there will be a written exam covering the topics of the course.

      Prerequisites: It is highly recommended (though not strictly required) that students have completed introductory micro- and macroeconomics before taking this class.

