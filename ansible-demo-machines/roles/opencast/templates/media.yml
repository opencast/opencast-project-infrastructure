    semester: "Spring Semester 2026"
    department: "D-ARCH"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199007&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Gegenstand der zweisemestrigen Vorlesung ist die Einführung in die Geschichte der Kunst und Architektur seit ca. 1970 bis heute. Ein ausserordentlicher Fokus in diesem Frühlingssemester liegt auf der Architektur- und Migrationsgeschichte der Schweiz im 20. und 21. Jahrhundert. 

      Ausgehend von aktuellen Fragestellungen zur Schweizer Migrationsgeschichte und ihrer fragmentierten Erinnerungskultur werden zentrale Fallstudien geschildert. Im historischen Rückblick werden thematische Zusammenhänge unter Begriffen wie beispielsweise "Amnesie", "Klassismus", "Produktion vs. Reproduktionsfaktoren", "Repräsentation", "Trauma" oder "Transformation" untersucht. Kunst und Architektur werden dabei nicht nur als Schauplatz kultureller Veränderungen, sondern auch als Indikator sozialer, ökonomischer, politischer Konflikte aufgefasst und damit als Gegenstand, durch welchen lokale wie globale Zusammenhänge klarer erfasst und dargestellt werden können.

  - identifier: "c6c195d2-b9a1-4e17-9427-7fc685122ebf"
    created: "2026-02-09"
    title: "Principles of Econometrics"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Sturm, Jan-Egbert"
    contributor: "Beerli, Andreas"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MTEC/2026/Spring/363-0570-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-mtec/2026/spring/363-0570-00L"
    semester: "Spring Semester 2026"
    department: "D-MTEC"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199118&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The term “econometrics” stands for the application of specific statistical methods to the field of economics. Econometrics aims at providing empirical evidence using observational data that can be used to learn about the real-world existence of specific relationships postulated in economic theories. Typical research questions that economists analyse by using econometric methods include for instance: Do minimum wages reduce employment? Does a gender wage gap exist and how large is it? Does foreign aid affect economic growth? How do interest rate changes influence exports? Is there an effect of economic outcomes on politicians’ chances to get re-elected?  

      Starting from simple regression analysis, the course introduces the statistical framework that is used in econometrics to answer such empirical research questions. A major focus is on understanding and mastering methods of hypothesis testing using multiple regressions.  
      The lecture discusses different issues regarding assumptions, interpretation, and inference in multiple linear regression models. Among others, the course addresses the following questions: How well or badly does the applied model fit the observed facts? How large is the estimate of the effects of one variable on another and how reliable is the estimate? Can the model be used to predict the specific variable of interest and how precise is that prediction? What are the crucial assumptions of the estimation strategy used, (how) can they be tested, and does the estimated relationship represent a causal effect?  

      The course lectures introduce the methods and computer tutorials give the students the opportunity to apply and deepen their knowledge using the software package STATA.

