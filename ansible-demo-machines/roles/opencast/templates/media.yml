  - identifier: "cf20747c-1a5c-4714-9692-70abfaf7485c"
    created: "2026-04-14"
    title: "Thermodynamics II"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Sansavini, Giovanni; Noiray, Nicolas"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MAVT/2026/Spring/151-0052-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-mavt/2026/spring/151-0052-00L"
    semester: "Spring Semester 2026"
    department: "D-MAVT"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=197968&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Part 1
      Introduction - Relevance of the topic and learning objectives.
      Basic concepts - Multicomponent systems with chemical reactions.
      Adiabatic flame temperature - First law of thermodynamics for chemically reacting systems.
      Chemical equilibrium - Second law of thermodynamics for chemically reacting systems.
      Fuel cells - Electrochemical energy converters and their distinction w.r.t. thermochemical ones.
      Kinetic gas theory - Fundamental properties of transport variables.

      Part 2
      Gas mixtures - Dalton’s law and thermodynamic analysis of ideal gas mixtures.
      Humid air - Psychometry and technical applications.
      Mixtures - Ideal solution and mixture phase behavior.
      Phase equilibria - Thermodynamic conditions for mixture equilibrium.

