    description: |
      Kontinuitäten und Wandel in der Gefängnisarchitektur wird von den verschiedenen Bauformen von Haftanstalten bis zur konkreten technischen Umsetzung der sich entwickelnden Anforderungen an die Überwachung, die Kontrolle der Kommunikation oder die Gewährleistung der physischen und psychischen Gesundheit der Häftlinge in den einzelnen Zellen nachgegangen. Betrachtet werden die Orte des Gefängnisbaus und die intendierten Aussenwirkungen der Architektur ebenso wie die baulichen Massnahmen zur Organisation des Raums des Zusammenlebens unter den Bedingungen der unterschiedlich weitreichenden Separierung der Insassen und Insassinnen und von verschiedenen Häftlingsgruppen mit der Einzelzelle als der zentralen technischen Innovation des modernen Strafvollzugs im Mittelpunkt. Das moderne Strafen im Gefängnis ist stets von den vier Zwecken der Vergeltung, des Schutzes der Gesellschaft durch das sichere Einsperren von Straftätern und -täterinnen, der Abschreckung und der individuellen Besserung der Delinquentinnen und Delinquenten angeleitet gewesen. Im Spannungsfeld dieser unterschiedlich gewichteten Ziele haben die verschiedenen Strafregime ebenso auf architektonischen wie auf technischen Mitteln basiert, die in der Vorlesung in Theorie und Praxis analysiert werden sollen – etwa wenn die Insassen und Insassinnen nicht nur unter permanente Beobachtung gestellt werden, sondern sich zur (Selbst )Disziplinierung auch ständig unter Beobachtung fühlen sollten, wenn die Eingesperrten voneinander isoliert und gleichzeitig arbeiten oder religiös unterwiesen werden sollten, aber auch, wenn die anderen Ziele demjenigen einer maximalen Sicherheit weitestgehend untergeordnet wurden.

