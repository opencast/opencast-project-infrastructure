    language: "eng"
    creator: "Brendel, Joé"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MATH/2026/Spring/401-4542-26L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-math/2026/spring/401-4542-26L"
    semester: "Spring Semester 2026"
    department: "D-MATH"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=202418&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Completely integrable systems have played a central role in physics and mathematics over the last few centuries. In this course, we will have an in-depth look at them from the point of view of symplectic geometry. Topics we discuss include the Arnold--Liouville theorem, obstructions to the existence of global action-angle, singularities of integrable systems and many examples. In the end, we will give an overview of almost toric fibrations (a special type of completely integrable systems) and their applications to modern symplectic topology.

  - identifier: "67db6f87-6ba1-4663-8302-30cd1207a0f0"
    created: "2026-02-17"
    title: "Automated Software Testing"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Su, Zhendong"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-INFK/2026/Spring/263-2815-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-infk/2026/spring/263-2815-00L"
    semester: "Spring Semester 2026"
    department: "D-INFK"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=198365&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The course will be organized into the following components: (1) classic and modern testing and analysis techniques (coverage metrics, mutation testing, metamorphic testing, combinatorial testing, symbolic execution, fuzzing, static analysis, etc.), (2) latest results on techniques and applications from diverse domains, and (3) open challenges and opportunities.

      A major component of this course is a class project. All students (individually or two-person teams) are expected to select and complete a course project. Ideally, the project is original research related in a broad sense to automated software testing and analysis. Potential project topics will also be suggested by the teaching staff.

      Students must select a project and write a one or two pages proposal describing why what the proposed project is interesting and giving a work schedule. Students will also write a final report describing the project and prepare a 20-30 minute presentation at the end of the course.

      The due dates for the project proposal, final report, and project presentation will be announced.

      The course will cover results from the Advanced Software Technologies (AST) Lab at ETH as well as notable results elsewhere, providing good opportunities for potential course project topics as well as MSc project/thesis topics.

