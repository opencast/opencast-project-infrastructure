    semester: "Spring Semester 2026"
    department: "D-GESS"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199148&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Data science in football is all about context.

      The content is organized into two streams. The first stream consists of lectures in which principles, methods, and their application are introduced and discussed. The following is a rough overview, with exemplary aspects listed for each topic.

      1. Introduction
       - history of measurement and analytics in sports
       - laws of the game: equipment, space, time, actors
       - data: match, event, tracking; sources, availability, uses
 
      2. Theory
       - game cycle: states, principles, expected threat

      3. Outcomes
       - competitions: tournaments, leagues
       - ranking teams: coefficients, latent strengths
       - predicting results: odds, statistics

      4. Individual Actions
       - running: heatmaps, trajectories, pitch control
       - passing: networks, line breaking, crosses
       - shooting: expected goals, expected points

      5. Collective Behavior
       - set pieces: penalties, corner kicks, etc. 
       - formations: positions, shapes
       - lineups: composition, substitutions

      6. Environment
       - recruitment: player profiles, transfer market, agents
       - governance: clubs, leagues, associations, confederations
       - engagement: attendance, merchandise, social media

      In the second stream, students gain first-hand experience by collaboratively analyzing professional-grade data from the current season of the UEFA Champions League. 

      This is the fifth, updated edition of the course. It is now an annual offering.

