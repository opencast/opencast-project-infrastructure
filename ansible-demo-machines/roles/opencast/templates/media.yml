    description: |
      Design Method: The course is based on a force-driven design methodology in which force flow is used as the primary generator of structural form, using tension and compression as a design language.

      Design Process: Projects are developed through an integrative, layered process that moves between concept, qualitative exploration, physical modeling, quantitative analysis & dimensioning, and materialization & tectonics, with continuous iteration and integration between layers.

      Project Structure: Students work in groups on a single project developed throughout the semester, from concept to materialized structural proposal.

      Tools and Media: Design exploration is supported by graphic statics and working physical models, used as thinking and design instruments rather than representational outputs.

      Course Format: Following the input lectures, the course alternates between workshops, desk critiques, and interim critiques, enabling iterative project development.

      Assessment: Evaluation is based on two interim critiques and a final oral group examination (project presentation), assessing conceptual clarity.

