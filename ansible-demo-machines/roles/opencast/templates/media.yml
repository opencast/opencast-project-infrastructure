    description: |
      Einführung in die Kryptogamen: systematische Einordnung der Algen, Protisten und Pilze; Entwicklungszyklen dieser Organismen in natürlichen und androgenen Ökosystemen und ihre Bedeutung dargestellt anhand von ausgewählten Beispielen. Die Gemeinsamkeiten resp die unterschiedlichen Eigenschaften zwischen verschiedenen systematischen Gruppen welche einerseits zur Klassifikation verwendet werden, anderseits zu unterschiedlichen oder gleichartigen Strategien zur Bekämpfung oder Förderung der Organismen in verschiedenen Ökosystemen (Agrar-, Forst- aquatische und Lebensmittel-Systeme) führen, sollten verstanden werden. Es werden Beispiele aus der Lehre der Pflanzen-Krankheiten, der Medizin, der Lebensmittelherstellung und Verwendung, der Biotechnologie, sowie der Meeres/Gewässerökologie verwendet um die Bedeutung für Mensch und Ökosysteme darzustellen.

      Form:
      Vorlesung mit Demonstrationsmaterial



      Kursinhalt:
      Prokaryotische Algen (Cyanophyta), Eukaryotische Algen, Pilzähnliche Protisten, Pilze, Flechten:
      Systematik, Lebenszyklen, Ökologie, Bedeutung.

