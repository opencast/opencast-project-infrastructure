    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=199754&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      We will examine the different stages of software development and lifecycle to better understand the challenges of managing software development projects, and the principles and processes used to address them. This will include topics such as requirements elicitation, modelling, design patterns, implementation decisions and trade-offs, testing, refactoring, and maintenance and enhancement of software products. 

      A team project will give participants the opportunity to apply the techniques introduced and to experience common software development challenges first-hand: for example, difficulties in eliciting technically meaningful requirements, integrating change requests, and managing an evolving code base. In this course, we will reverse the roles: participants will take on the task of delivering high quality software under our supervision. In this way, participants will gain a deeper understanding of the challenges of software development.

