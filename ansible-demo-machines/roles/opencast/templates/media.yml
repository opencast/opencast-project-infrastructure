  - identifier: "1e3f1a96-c5bb-44c6-8cee-577b6206f78b"
    created: "2023-02-17"
    title: "Soft and Biohybrid Robotics"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "CC-BY-NC-ND"
    language: "eng"
    creator: "Katzschmann, Robert"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MAVT/2023/Spring/151-0636-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-mavt/2023/spring/151-0636-00L"
    semester: "Spring Semester 2023"
    department: "D-MAVT"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2023S&lerneinheitId=166950&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Students will learn about the latest research advances in material technologies, fabrication, modeling, and machine learning to design, simulate, build, and control soft and biohybrid robots.

      Part 1: Functional and intelligent materials for use in soft and biohybrid robotic applications
      Part 2: Design and design morphologies of soft robotic actuators and sensors
      Part 3: Fabrication techniques including 3D printing, casting, roll-to-roll, tissue engineering
      Part 4: Biohybrid robotics including microrobots and macrorobots; tissue engineering
      Part 5: Mechanical modeling including minimal parameter models, finite-element models, and ML-based models
      Part 6: Closed-loop controllers of soft robots that exploit the robot's impedance and dynamics for locomotion and manipulation tasks
      Part 7: Machine Learning approaches to soft robotics, for design synthesis, modeling, and control

      Regular assignments throughout the semester will teach the participants to implement the skills and knowledge learned during the class.

  - identifier: "06e35c6a-fb5a-4ee3-bbab-d6a70db90ca1"
    created: "2022-02-18"
    title: "AI Center Projects in Machine Learning Research"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Ilic, Alexander"
    contributor: "Sanyal, Amartya; Sorbaro Sindaci, Martino; Ramponi, Giorgia; Engelmann, Francis; Marx, Alexander; Elassady, Menna; Kontogianni, Theodora"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-INFK/2022/Spring/263-5051-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-infk/2022/spring/263-5051-00L"
    semester: "Spring Semester 2022"
    department: "D-INFK"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2022S&lerneinheitId=161078&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The course will be structured as sections taught by different PostDocs specialized in the relevant fields. Each section will showcase an advanced research topic in machine learning, first introducing it and motivating it in the context of current technological or scientific advancement, then providing practical applications that students can experiment with, ideally with the aim of reproducing a very simple, known result in the specific field. 
      The tentative list of topics for this year is 3D scene understanding, graph neural networks, causal discovery, event-based sensors, trustworthy AI, reinforcement learning and visual text analytics. The last weeks of the course will be reserved for the implementation of the final project that the students can select among one of the presented areas.

  - identifier: "7786a7c8-a9ba-4e97-94ca-e23ec095c726"
    created: "2021-10-13"
    title: "Entwurf V-IX: Einfach Wohnen (E. Mosayebi)"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "deu"
    creator: "Mosayebi, Elli"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-ARCH/2021/Autumn/052-1125-21L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-arch/2021/autumn/052-1125-21L"
    semester: "Autumn Semester 2021"
    department: "D-ARCH"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2021W&lerneinheitId=154651&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Wie wollen wir wohnen? Kaum eine Bauaufgabe in der Architektur ist so grundlegend und so stark über Konventionen bestimmt wie das Wohnen. Schwerpunkt der Arbeit im Studio bildet die kritische und experimentelle Auseinandersetzung mit neuen Wohnformen in unterschiedlichen Klimagebieten der Schweiz. Der vergleichsweise kleine Massstab erlaubt die Fokussierung der Projekte auf die Themen des Innenraumes, der Wohnform und der grundlegenden architektonischen Elemente.

      Diese Grundelemente werden umfassend verstanden und meinen nicht nur bauliche Elemente wie tragende Teile, Fenster, Türen, Treppen, sondern schliessen auch sekundäre Komponenten wie Betten, Tische, Vorhänge mit ein. Ist es denkbar, die Wohnform ausgehend von einem architektonischen Element oder Möbel zu entwickeln? Können wir uns einen bewohnbaren Lift vorstellen? Wie würde ein Grundriss ausgehend von einem Kühlschrank entworfen? Wer würde solche Räume bewohnen? Die Grundelemente stehen für die Dinghaftigkeit und Handwerklichkeit der Architektur. Im Diskurs über soziales und ökologisches Bauen geht die Bedeutung der alltäglichen Elemente gerne vergessen, obschon es massgeblich die Dinge selbst sind, welche zwischen dem Leben und der Welt Sinn oder Widersinn stiften. 

      Ausgehend von einem Grundelement analysieren Sie zu Beginn des Semesters die spezifischen Eigenschaften und die Vielfalt der Erscheinungsformen in unterschiedlichen geographischen Kontexten. Sie fragen: Welchen Funktionen dient das Element, welche Geschichten hat es durchlaufen, welche Normen hat es zementiert, in welchen Materialien und Konstruktionsprinzipien wird es erstellt und welches zukünftige Potential kann es erschliessen? Neben politischen, gesellschaftlichen, geschlechterspezifischen und klimatischen Zusammenhängen thematisieren Sie auch das Zusammenwirken von Raum, Körper und Massstab und damit die Wahrnehmung, Wirkung und Benutzung von Architektur. 

      Das Semester erfolgt in Kooperation mit Prof. Dr. Ákos Moravánszky. In Workshops mit den Künstlern Taiyo Onorato und Nico Krebs entstehen experimentelle Bilder der Projekte.

