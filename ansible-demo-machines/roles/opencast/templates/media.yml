    contributor: "Friedrich Wicker, Felix"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-INFK/2026/Spring/277-0002-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-infk/2026/spring/277-0002-00L"
    semester: "Spring Semester 2026"
    department: "D-INFK"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=202119&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      We start from the basics already learned in the previously visited CAS courses, and explain the technical and social side of cyber security in simple terms without requiring prior experience beyond the CAS courses.

      Topics will include:
      - introduction to the implications of IT security on society and economy
      - adversarial thinking
      - cryptographic primitives and their mathematical foundations; building blocks for abstract channels
      - symmetric and asymmetric (public key) cryptography
      - cryptographic security protocols, including security properties and relevant threat models
      - key distribution and management, discussion of trust (trusted vs. trustworthy)
      - end-to-end encryption
      - privacy considerations
      - access control systems and policies

      All topics will be accompanied by example case studies to showcase their usefulness, as well as practical exercises for participants to get hands-on experience.

      In summary, participants will gain an understanding of cyber security fundamentals and practical principles to apply. This enables them to navigate the quickly changing cyber security landscape in their specific work environment.

