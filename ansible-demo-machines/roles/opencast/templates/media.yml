  - identifier: "a6d2ec68-4f03-432c-b4b6-59a3676cb4a6"
    created: "2026-02-17"
    title: "Soft and Biohybrid Robotics"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Katzschmann, Robert"
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-MAVT/2026/Spring/151-0636-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-mavt/2026/spring/151-0636-00L"
    semester: "Spring Semester 2026"
    department: "D-MAVT"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=197730&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      The course provides a structured overview of the key building blocks of soft and biohybrid robotics, combining theory with hands-on practice:

      1) Materials and fabrication
      Soft polymers, elastomers, bioinspired and living materials, additive manufacturing, casting, and biofabrication techniques.

      2) Actuation principles
      Fluidic, electrostatic, and other compliant actuation mechanisms, including their modeling and design trade-offs.

      3) Sensing in soft robots
      Embedded and distributed sensing, proprioception, and state estimation for deformable and continuum systems.

      4) Design and fabrication of soft robots
      System-level integration of materials, actuation, sensing, and power transmission for functional robotic devices, such as robotic hands, robotic fish, and legged robots.

      5) Biohybrid robotic systems
      Robots incorporating living cells and tissues, including neuromuscular actuation and hybrid fabrication approaches.

      6) Mechanics and simulation
      Continuum and solid mechanics, finite-element methods, reduced-order models, and data-driven simulation techniques.

      7) Learning and control
      Optimization, reinforcement learning, and data-driven control methods tailored to soft robotic systems.

      Regular assignments guide students through practical implementations of modeling, simulation, design, and control methods.

