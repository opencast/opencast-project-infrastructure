  - identifier: "2ce384e6-4069-4ff6-9854-95b93f9511e5"
    created: "2026-02-04"
    title: "Vertiefte Grundlagen der Chemie II  für Lehrdiplom"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "deu"
    creator: "Thilgen, Carlo"
    contributor: "Steinegger, Patrick; Günther, Detlef; Riek, Roland"
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-CHAB/2026/Spring/529-0961-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-chab/2026/spring/529-0961-00L"
    semester: "Spring Semester 2026"
    department: "D-CHAB"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=198729&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      Die fachwissenschaftliche Vertiefung vermittelt in erster Linie grundlegende fachwissenschaftliche Kompetenzen. Fachdidaktische Aspekte oder konkrete Anregungen zur Gestaltung des gymnasialen Unterrichts sind eine mögliche Ergänzung, stehen aber nicht im Mittelpunkt.

      Thematische Schwerpunkte:

      1a) Entdeckungsgeschichte der Fullerene, strukturelle Merkmale und Synthese von Fullerenen und schalenförmigen polycyclischen aromatischen Kohlenwasserstoffen, Grundzüge der Chemie von Fullerenen und Strukturen ausgewählter Derivate;
      1b) Wasserstoffbrückenbindungen: Definition, Merkmale und Kriterien, Geometrien, beteiligte Wechselwirkungen, energetische Betrachtungen, Beziehung zwischen Bindungsstärke und Geometrie, H-Brücken in Kristallstrukturen (Röntgen- vs. Neutronenbeugung), spektroskopische Charakterisierung (IR, NMR), gängige und ungewöhnliche H-Brückendonoren und -akzeptoren, H-Brücken in der supramolekularen Chemie, H-Brücken und die Struktur von Wasser, Beschaffenheit des Protons in kondensierten Phasen.
      2) Geschichte der Radioaktivität und moderne Radiochemie: Von der Entdeckung der Radioaktivität zur modernen Elementsynthese.
      3) Die Thermodynamik wird rekapituliert, der Zeitpfeil des 2. Hauptsatzes im Detail analysiert (auch philosophisch), die Gleichgewichtskonstante aus dem 2. Hauptsatz hergeleitet und mit der Software ETHermodynamics mit In-silico-Experimenten begleitet. Die übergeordnete Idee besteht darin, die Thermodynamik für die gymnasiale Stufe erfassbar zu machen.
      4a) Verschiedene Methoden zur qualitativen und quantitativen Analyse von Feststoffen; 
      4b) Spezifische Vorteile des Laserabtrags mit induktiv gekoppeltem Plasma in Kombination mit Massenspektrometrie; 
      4c) Vor- und Nachteile der Quantifizierung im Bereich geologischer und materialwissenschaftlicher Proben.

