  - identifier: "db6f174d-2e12-477c-8a93-20a970d8349e"
    created: "2026-02-06"
    title: "Mechano-Genomics in Health and Disease"
    rightsHolder: "ETH Zürich, Schweiz"
    license: "ALLRIGHTS"
    language: "eng"
    creator: "Shivashankar, G.V."
    contributor: ""
    publisher: "ETH Zürich, ID MMS; Schweiz"
    vp1_url: "https://www.video.ethz.ch/Lectures/D-HEST/2026/Spring/376-1392-00L"
    tobira_url: "https://www.video.ethz.ch/lectures/d-hest/2026/spring/376-1392-00L"
    semester: "Spring Semester 2026"
    department: "D-HEST"
    vvz: "http://www.vvz.ethz.ch/Vorlesungsverzeichnis/lerneinheit.view?semkez=2026S&lerneinheitId=198376&ansicht=LEHRVERANSTALTUNGEN"
    description: |
      We will focus on cells and tissues while introducing the major methods used to uncover the principles of mechano-genomics. We will begin by discussing cellular mechanotransduction mechanisms and their role in regulating genomes. This will be followed by an analysis of the mechano-genomic foundations of cellular differentiation, cell-state transitions, and homeostasis. Building on this understanding, we will explore the mechano-genomic basis of cellular aging and its impact on tissue regeneration, including neurodegeneration and musculoskeletal systems. We will also highlight the importance of tissue organoid models in regenerative medicine. Finally, we will cover the broad field of mechano-pathology and the development of cell-state mechano-genomic biomarkers as indicators of tissue homeostasis and disease. Collectively, this course will provide a quantitative framework for understanding mechano-genomic processes at the cellular level and how they intersect with tissue function and disease.


      Lecture-1: Introduction to the course: forces, signalling and cell behaviour 
      Lecture-2: Methods to engineer and sense mechanobiological processes
      Lecture-3: Cellular mechanosensing and cytoskeletal remodelling
      Lecture-4: Nuclear mechanotransduction pathways
      Lecture-5: Genome organization and regulation
      Lecture-6: Cell division and genome integrity
      Lecture-7: Differentiation and developmental programs
      Lecture-8: Tissue microenvironment and homeostasis
      Lecture-9: Cellular aging, reprogramming and rejuvenation
      Lecture-10: Tissue degeneration, regeneration and organoid models
      Lecture-11: Microbial systems and host-pathogen interactions
      Lecture-12: Mechano-pathology and cell-state biomarkers
      Lecture-13: Concluding lecture
      Lecture-14 slot is reserved for the Final exam in class

