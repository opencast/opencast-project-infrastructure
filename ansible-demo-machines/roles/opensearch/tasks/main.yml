---

# OpenSearch and the ICU analysis plugin are installed from the Opencast
# package repository, which ships them in matching versions.
- name: Install OpenSearch and the ICU analysis plugin
  ansible.builtin.package:
    name:
      - opensearch
      - "{{ 'opensearch-analysis-icu' if ansible_facts['os_family'] == 'Debian' else 'opensearch-plugin-analysis-icu' }}"
    state: present

# All-in-one installation with OpenSearch only listening on localhost
# https://docs.opencast.org/develop/admin/configuration/searchindex/opensearch/
- name: Disable OpenSearch security plugin
  ansible.builtin.lineinfile:
    path: /etc/opensearch/opensearch.yml
    regexp: '^plugins\.security\.disabled:'
    line: 'plugins.security.disabled: true'

- name: Create OpenSearch override directory
  ansible.builtin.file:
    owner: root
    group: root
    mode: '0755'
    path: /etc/systemd/system/opensearch.service.d
    state: directory

- name: Deploy OpenSearch override
  ansible.builtin.copy:
    src: override.conf
    dest: /etc/systemd/system/opensearch.service.d
    owner: root
    group: root
    mode: '0644'

- name: Restarting OpenSearch
  ansible.builtin.systemd_service:
    name: opensearch
    state: restarted
    enabled: true
    daemon_reload: true
